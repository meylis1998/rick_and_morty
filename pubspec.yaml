name: rick_and_morty
description: Rick and Morty character browser
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Animations
  animations: ^2.0.11
  # State Management
  bloc: ^8.1.4
  # UI & Images
  cached_network_image: ^3.3.1
  # Icons
  cupertino_icons: ^1.0.8
  # Networking
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  # Database
  drift: ^2.16.0
  # State Management
  equatable: ^2.0.5
  # Theme
  flex_color_scheme: ^7.3.1
  flutter_animate: ^4.5.0
  flutter_bloc: ^8.1.6
  flutter_cache_manager: ^3.3.1
  # JSON Serialization
  freezed_annotation: ^2.4.1
  # Dependency Injection
  get_it: ^7.6.7
  # Navigation
  go_router: ^13.2.0
  infinite_scroll_pagination: ^4.0.0
  injectable: ^2.3.5
  json_annotation: ^4.8.1
  path: ^1.9.0
  path_provider: ^2.1.2
  retrofit: ^4.1.0
  shared_preferences: ^2.2.2
  sqlite3_flutter_libs: ^0.5.20

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  bloc_test: ^9.1.7
  # Code Generation
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  freezed: ^2.4.7
  injectable_generator: ^2.4.2
  json_serializable: ^6.7.1
  # Testing
  mocktail: ^1.0.3
  retrofit_generator: ^8.1.0
  # Linting
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
