name: rick_and_morty
description: Rick and Morty character browser
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Animations
  animations: ^2.0.11
  # State Management
  bloc: ^9.1.0
  # UI & Images
  cached_network_image: ^3.3.1
  # Icons
  cupertino_icons: ^1.0.8
  # Networking
  dartz: ^0.10.1
  dio: ^5.4.0
  # State Management
  equatable: ^2.0.5
  # Theme
  flex_color_scheme: ^8.3.1
  flutter_animate: ^4.5.0
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.3.1
  hydrated_bloc: ^10.1.1
  # Dependency Injection
  get_it: ^9.1.1
  # Navigation
  go_router: ^17.0.0
  infinite_scroll_pagination: ^5.1.1
  injectable: ^2.3.5
  json_annotation: ^4.8.1
  path: ^1.9.0
  path_provider: ^2.1.2
  retrofit: ^4.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  bloc_test: ^10.0.0
  # Code Generation
  build_runner: ^2.4.8
  injectable_generator: ^2.4.2
  json_serializable: ^6.7.1
  # Testing
  mocktail: ^1.0.3
  retrofit_generator: ^10.2.0
  # Linting
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
